[package]
name = "cactusbar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cactusbar"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
gdk4 = "0.9"
graphene = { version = "0.20", package = "graphene-rs" }
glib = "0.20"
gio = "0.20"
pango = "0.20"
gdk-pixbuf = "0.20"
gtk4-layer-shell = "0.5"
zbus = { version = "4", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["clock"] }
async-channel = "2"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
